name: HPC Mail CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        node-version: [22, 26]
    steps:
      # 第三方 Action 固定到完整 commit SHA（注释为对应版本）
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      # 两份 OpenAPI 导出后按仓库根 .spectral.yaml 检查（固定版本、不跑安装脚本、env -i 隔离环境）。
      # 只放在 PR CI：这里没有生产密钥；部署工作流不跑 npx 现装的第三方包
      - name: OpenAPI 规范检查（Spectral）
        run: bash scripts/check-openapi.sh "$RUNNER_TEMP/openapi"
      - run: node scripts/check-deploy-scripts.mjs
      - run: pnpm build
      - run: pnpm audit --prod --audit-level high
