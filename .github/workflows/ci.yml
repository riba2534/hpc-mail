name: HPC Mail CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        node-version: [22, 26]
    steps:
      # 第三方 Action 固定到完整 commit SHA（注释为对应版本）
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      # 两份 OpenAPI 导出后按仓库根 .spectral.yaml 检查；Spectral 固定版本经 npx 现装，不跑安装脚本，env -i 只给 PATH/HOME
      - name: OpenAPI 规范检查（Spectral）
        run: |
          node apps/worker/scripts/export-openapi.mjs "$RUNNER_TEMP/openapi"
          env -i PATH="$PATH" HOME="$HOME" npm_config_ignore_scripts=true \
            npx --yes @stoplight/spectral-cli@6.17.1 lint "$RUNNER_TEMP/openapi/api.json" "$RUNNER_TEMP/openapi/v1.json" \
            --ruleset .spectral.yaml --fail-severity=error
      - run: node scripts/check-deploy-scripts.mjs
      - run: pnpm build
      - run: pnpm audit --prod --audit-level high
