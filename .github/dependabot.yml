# 版本更新每周一次、按组合并；安全更新由仓库设置里的 Dependabot security updates 即时单独发起，不受分组与冷却期影响。
# 大版本不进分组，单独开 PR 逐个评估。
version: 2
updates:
  - package-ecosystem: npm
    # pnpm workspace：根目录的 pnpm-lock.yaml 覆盖 apps/* 与 packages/*
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    # 新版本发布 3 天后再提，避开被撤回或投毒的版本
    cooldown:
      default-days: 3
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      # vitest 与 Workers 测试插件有 peer 约束，放同一组；依赖按第一个匹配的组归类
      test-tooling:
        patterns:
          - "vitest"
          - "@vitest/*"
          - "@cloudflare/vitest-plugin"
          - "@testing-library/*"
          - "jsdom"
        update-types: [minor, patch]
      cloudflare:
        patterns:
          - "wrangler"
          - "@cloudflare/*"
        update-types: [minor, patch]
      frontend:
        patterns:
          - "react"
          - "react-dom"
          - "react-router-dom"
          - "@types/react"
          - "@types/react-dom"
          - "@radix-ui/*"
          - "@tanstack/*"
          - "vite"
          - "@vitejs/*"
          - "tailwindcss"
          - "@tailwindcss/*"
        update-types: [minor, patch]
      production:
        dependency-type: production
        update-types: [minor, patch]
      development:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns: ["*"]
