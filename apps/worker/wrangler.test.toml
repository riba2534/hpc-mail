# 测试专用配置（@cloudflare/vitest-pool-workers 消费）
# 与生产 wrangler.toml 一致，但去掉 miniflare 无法本地模拟的 send_email binding，
# 以及不需要的 routes/custom_domain。集成测试不发外部邮件，不调 env.email。
name = "hpc-cloud-mail"
main = "src/index.ts"
compatibility_date = "2025-06-04"

[vars]
# 域名由 settings.domains.list 维护，测试在 setup 里 updateSettings 设置

[[d1_databases]]
binding = "db"
database_name = "hpc-cloud-mail-db"
# miniflare 全程本地模拟，ID 只需占位
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "kv"
id = "00000000000000000000000000000000"

[[r2_buckets]]
binding = "r2"
bucket_name = "hpc-cloud-mail-r2"

[assets]
binding = "assets"
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/v1/*"]
