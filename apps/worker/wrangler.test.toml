# 测试专用配置（@cloudflare/vitest-plugin 消费）
# 以生产 wrangler.toml 为基础：去掉 miniflare 无法本地模拟的 send_email binding、不需要的 routes/custom_domain，
# 资源 ID 用全零假值；其余绑定与变量改动时需手动同步，两份文件不会自动保持一致。集成测试不发外部邮件，不调 env.email。
# 也不配 [[ratelimits]]：miniflare 的限流计数在所有测试文件间共享，各文件的用户 id 会互相占额度。
# 测试里由 services/rate-limit.ts 的进程内替身计数（每个测试文件独立），需要时在 env 里注入假 binding。
name = "hpc-cloud-mail"
main = "src/index.ts"
compatibility_date = "2026-11-16"
# 2026-08-04 起 nodejs_compat 随日期默认开启；本 Worker 不依赖 Node API（mimetext 走 browser 入口），
# 显式关闭以保持运行时不出现 process/Buffer 等全局、process.env 不注入 secrets。
compatibility_flags = ["no_nodejs_compat", "no_nodejs_compat_v2"]

[vars]
# 域名由 settings.domains.list 维护，测试在 setup 里 updateSettings 设置

[[d1_databases]]
binding = "db"
database_name = "hpc-cloud-mail-db"
# miniflare 全程本地模拟，ID 只需占位
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "kv"
id = "00000000000000000000000000000000"

[[r2_buckets]]
binding = "r2"
bucket_name = "hpc-cloud-mail-r2"

[assets]
binding = "assets"
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/v1/*"]
