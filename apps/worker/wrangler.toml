name = "hpc-cloud-mail"
main = "src/index.ts"
compatibility_date = "2025-06-04"
# account_id 不入库：wrangler 从 CLOUDFLARE_ACCOUNT_ID 环境变量读取（CI 由 GitHub Variables 提供）
# 默认跑在 workers.dev（Deploy to Cloudflare 一键部署路径）；
# 自有域名部署由 CI 注入 routes 并关闭 workers_dev（deploy.yml「注入 Cloudflare 资源配置」步骤）
workers_dev = true

# 双下划线占位符：GitHub Actions 部署时由 CI 注入真实值；一键部署时由 Cloudflare 自动创建资源并改写；
# 本地 wrangler dev 跑本地模拟，不需要真实 ID

[observability]
enabled = true

[triggers]
crons = ["*/5 * * * *", "0 16 * * *"]

[vars]
# 系统域名不再写死在 vars，改由 settings.domains.list（管理端维护）；见 services/domain.ts
ai_model = "@cf/meta/llama-3.1-8b-instruct"
site_origin = "https://hpc.email"
build_sha = "local"

[[d1_databases]]
binding = "db"
database_name = "hpc-cloud-mail-db"
database_id = "__D1_DATABASE_ID__"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "kv"
id = "__KV_NAMESPACE_ID__"

[[r2_buckets]]
binding = "r2"
bucket_name = "hpc-cloud-mail-r2"

# Cloudflare 原生发信（send_email binding）
[[send_email]]
name = "email"

[ai]
binding = "ai"

[assets]
binding = "assets"
directory = "./dist"
not_found_handling = "single-page-application"
# Agent 文档必须经过 Worker：补 UTF-8，并阻止缺失文档回退为成功的 SPA HTML。
run_worker_first = ["/api", "/api/*", "/v1", "/v1/*", "/skill.md", "/references/*", "/llms.txt", "/assets/*"]

# Secrets（wrangler secret put）：
#   jwt_secret              JWT 签名密钥（必需）
